<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Free Trial — AgentFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="/index.html" class="logo">Agent<span>Flow</span></a>
    <div class="nav-links">
      <a href="/pages/login.html">Already have an account? <strong style="color:var(--gold)">Log In</strong></a>
    </div>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <a href="/index.html" class="logo">Agent<span>Flow</span></a>
    <h2>Start your free trial</h2>
    <p class="auth-sub">14 days free · then $49/month · cancel anytime</p>
    <div class="trial-badge">
      <span>🎉</span>
      <span>No credit card required. Full access for 14 days, completely free.</span>
    </div>
    <div id="signupError" style="display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:12px 16px;color:#ef4444;font-size:0.85rem;margin-bottom:20px;"></div>
    <div class="form-group">
      <label>Full name</label>
      <input type="text" id="name" placeholder="John Smith" autocomplete="name">
    </div>
    <div class="form-group">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Minimum 8 characters" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>Agency name <span style="color:var(--text-dim)">(optional)</span></label>
      <input type="text" id="agency" placeholder="e.g. Dubai Luxury Homes">
    </div>
    <div class="form-group">
      <label>Your market</label>
      <select id="market" style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:13px 16px;color:var(--white);font-size:0.95rem;font-family:'DM Sans',sans-serif;width:100%;outline:none;">
        <option value="uae">🇦🇪 UAE — Dubai / Abu Dhabi</option>
        <option value="uk">🇬🇧 UK — London / Manchester</option>
      </select>
    </div>
    <button class="btn-primary" onclick="handleSignup()" id="signupBtn" style="margin-top:8px;">Create Free Account</button>
    <p style="text-align:center;color:var(--text-dim);font-size:0.78rem;margin-top:16px;line-height:1.5;">
      By signing up you agree to our Terms of Service and Privacy Policy.
    </p>
    <div class="auth-switch">Already have an account? <a href="/pages/login.html">Log in</a></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
if (Auth.isLoggedIn()) window.location.href = '/pages/dashboard.html';

async function handleSignup() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const agency = document.getElementById('agency').value.trim();
  const market = document.getElementById('market').value;
  const btn = document.getElementById('signupBtn');
  const err = document.getElementById('signupError');
  err.style.display = 'none';

  if (!name) { showErr('Please enter your full name.'); return; }
  if (!email || !email.includes('@')) { showErr('Please enter a valid email.'); return; }
  if (password.length < 8) { showErr('Password must be at least 8 characters.'); return; }

  btn.innerHTML = '<span style="display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,0.2);border-top-color:#000;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:8px;"></span>Creating account…';
  btn.disabled = true;

  try {
    await Auth.signup(name, email, password, agency, market);
    window.location.href = '/pages/dashboard.html';
  } catch (e) {
    showErr(e.message || 'Signup failed. Please try again.');
    btn.textContent = 'Create Free Account';
    btn.disabled = false;
  }
}

function showErr(msg) {
  const err = document.getElementById('signupError');
  err.textContent = msg; err.style.display = 'block';
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') handleSignup(); });
</script>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</body>
</html>
