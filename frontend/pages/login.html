<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — AgentFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="/index.html" class="logo">Agent<span>Flow</span></a>
    <div class="nav-links">
      <a href="/pages/signup.html">No account? <strong style="color:var(--gold)">Start Free Trial</strong></a>
    </div>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <a href="/index.html" class="logo">Agent<span>Flow</span></a>
    <h2>Welcome back</h2>
    <p class="auth-sub">Log in to your AgentFlow dashboard</p>
    <div id="loginError" style="display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:12px 16px;color:#ef4444;font-size:0.85rem;margin-bottom:20px;"></div>
    <div class="form-group">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div style="text-align:right;margin-bottom:24px;">
      <a href="#" style="color:var(--gold);font-size:0.82rem;text-decoration:none;">Forgot password?</a>
    </div>
    <button class="btn-primary" onclick="handleLogin()" id="loginBtn">Log In</button>
    <div class="auth-switch">No account yet? <a href="/pages/signup.html">Start your free 14-day trial</a></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
// Redirect if already logged in
if (Auth.isLoggedIn()) window.location.href = '/pages/dashboard.html';

async function handleLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  err.style.display = 'none';

  if (!email || !password) { showErr('Please enter your email and password.'); return; }

  btn.innerHTML = '<span style="display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,0.2);border-top-color:#000;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:8px;"></span>Logging in…';
  btn.disabled = true;

  try {
    await Auth.login(email, password);
    window.location.href = '/pages/dashboard.html';
  } catch (e) {
    showErr(e.message || 'Login failed. Please check your email and password.');
    btn.textContent = 'Log In';
    btn.disabled = false;
  }
}

function showErr(msg) {
  const err = document.getElementById('loginError');
  err.textContent = msg;
  err.style.display = 'block';
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</body>
</html>
